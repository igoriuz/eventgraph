name: release

# Publishes every package at the version in its package.json. Tag a release
# (git tag v0.2.0 && git push --tags) or run it by hand.
#
# There is no NPM_TOKEN. Publishing authenticates over OIDC via npm trusted
# publishing, so the credential is minted per run, scoped to this repository and
# this workflow file, and cannot be reused if it leaks. That has to be armed
# once per package under Settings → Trusted publishers on npmjs.com, naming
# this file — and a package has to exist before it can be configured, so the
# first version of each is published by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the runner mint the OIDC token npm checks

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Deliberately no registry-url: with it, setup-node writes an .npmrc
      # containing _authToken=${NODE_AUTH_TOKEN} and substitutes a placeholder
      # when that variable is unset. npm then believes it holds a credential,
      # never attempts the OIDC handshake, and the registry answers the
      # resulting anonymous PUT with a misleading 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs npm 11.5.1 or newer; node 22 ships npm 10.
      - run: npm install -g npm@latest

      - run: npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test

      # pnpm pack rewrites the workspace:* ranges into real versions, which
      # `npm publish` on a directory would not do. Publishing the tarball keeps
      # that rewrite and still authenticates over OIDC.
      - name: Pack
        run: |
          mkdir -p /tmp/tarballs
          for pkg in core viewer cli mcp; do
            # Has to run inside the package: `pnpm --filter <dir> pack` writes
            # nothing at all, silently.
            (cd "packages/$pkg" && pnpm pack --pack-destination /tmp/tarballs)
          done
          ls -la /tmp/tarballs
          test "$(ls -1 /tmp/tarballs/*.tgz | wc -l)" -eq 4

      # Bootstrap only. A trusted publisher is registered per package and a
      # package has to exist first, so version 0.1.0 cannot be published by
      # OIDC alone. Use a granular token limited to these four packages with
      # "Bypass two-factor authentication" enabled — that box is what makes it
      # work at all for an account secured with passkeys, which have no OTP to
      # type. Once each package exists and its trusted publisher is registered
      # on npmjs.com, delete the NPM_TOKEN secret and this step: OIDC then
      # authenticates with nothing stored anywhere.
      - name: Authenticate for the first publish
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

      - name: Publish
        run: |
          for tarball in /tmp/tarballs/*.tgz; do
            echo "publishing $tarball"
            npm publish "$tarball" --access public --provenance
          done
