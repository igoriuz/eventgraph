name: release

# A tag is the only thing that releases. Push one and this builds, tests,
# publishes to npm whatever version is not on the registry yet, and writes the
# GitHub release for that tag — so the tag, the release and the published
# versions can never disagree with each other.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Cutting a release from the GitHub UI works too: it creates the tag, which is
# the same event, and the release notes are then filled in by the run.
#
# There is no NPM_TOKEN. Publishing authenticates over OIDC via npm trusted
# publishing, so the credential is minted per run, scoped to this repository and
# this workflow file, and cannot be reused if it leaks. It is armed per package
# under Settings → Trusted publishers on npmjs.com, naming this file.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # to write the release for the tag
  id-token: write # lets the runner mint the OIDC token npm checks

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Deliberately no registry-url: with it, setup-node writes an .npmrc
      # containing _authToken=${NODE_AUTH_TOKEN} and substitutes a placeholder
      # when that variable is unset. npm then believes it holds a credential,
      # never attempts the OIDC handshake, and the registry answers the
      # resulting anonymous PUT with a misleading 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs npm 11.5.1 or newer; node 22 ships npm 10.
      - run: npm install -g npm@latest

      - run: npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test

      # pnpm pack rewrites the workspace:* ranges into real versions, which
      # `npm publish` on a directory would not do. Publishing the tarball keeps
      # that rewrite and still authenticates over OIDC.
      - name: Pack
        run: |
          mkdir -p /tmp/tarballs
          for pkg in core viewer cli mcp; do
            # Has to run inside the package: `pnpm --filter <dir> pack` writes
            # nothing at all, silently.
            (cd "packages/$pkg" && pnpm pack --pack-destination /tmp/tarballs)
          done
          ls -la /tmp/tarballs
          test "$(ls -1 /tmp/tarballs/*.tgz | wc -l)" -eq 4

      # Only some packages change in a given release, and republishing a version
      # that already exists is an error that would abort the rest of the loop.
      # The lines written here become the body of the GitHub release, so what it
      # claims was shipped is what npm actually accepted.
      - name: Publish what is new
        run: |
          published=0
          : > /tmp/published.md
          for tarball in /tmp/tarballs/*.tgz; do
            meta=$(tar -xzOf "$tarball" package/package.json)
            name=$(node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).name' <<< "$meta")
            version=$(node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' <<< "$meta")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "skipping $name@$version — already on the registry"
              continue
            fi
            echo "publishing $name@$version"
            npm publish "$tarball" --access public --provenance
            echo "- [\`$name@$version\`](https://www.npmjs.com/package/$name/v/$version)" >> /tmp/published.md
            published=$((published + 1))
          done
          echo "published $published package(s)"
          if [ "$published" -eq 0 ]; then
            echo 'Nothing new on npm — every package at this tag was already published.' > /tmp/published.md
          fi

      # Written after the publish, never before: a release that exists while the
      # registry does not have the packages is the one lie this is meant to
      # prevent. `--generate-notes` appends the commit log since the last tag.
      - name: Write the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo '### Published'
            echo
            cat /tmp/published.md
          } > /tmp/notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
            gh release upload "$TAG" /tmp/tarballs/*.tgz --clobber
          else
            # --notes rather than --notes-file: only the former is prepended to
            # the generated notes, a file would replace them.
            gh release create "$TAG" /tmp/tarballs/*.tgz \
              --title "$TAG" \
              --notes "$(cat /tmp/notes.md)" \
              --generate-notes
          fi
